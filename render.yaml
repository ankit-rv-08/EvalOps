services:
  - type: web
    name: evalops
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GROQ_API_KEY
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: evalops-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.9

databases:
  - name: evalops-db
    plan: free
    databaseName: evalops
    user: evalops
